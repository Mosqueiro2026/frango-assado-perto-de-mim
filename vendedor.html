
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área do Vendedor - Frango Assado Perto de Mim</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #fff7ed;
      color: #292524;
      padding: 16px;
      margin: 0;
    }
    main {
      background: white;
      max-width: 520px;
      margin: 35px auto;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 14px #00000012;
    }
    h1 { color: #b45309; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #aaa;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      padding: 12px 18px;
      margin-top: 18px;
      background: #b45309;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #mensagem { margin-top: 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>🍗 Área do Vendedor</h1>
    <h2>Frango Assado Perto de Mim</h2>

    <p id="mensagem" role="status">Verificando acesso...</p>

    <section id="login" hidden>
      <p>Entre com seu e-mail e senha cadastrados.</p>
      <form id="formLogin">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password"
               autocomplete="current-password" required>

        <button id="entrar" type="submit">Entrar</button>
      </form>
    </section>

    <section id="painel" hidden>
      <h3>Meu cadastro</h3>
      <p id="nomeVendedor"></p>
      <p id="bairroVendedor"></p>
      <p id="precoVendedor"></p>
      <p>Consulta disponível. Edição em preparação.</p>
      <button id="sair" type="button">Sair</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const URL_SUPABASE = "https://mublqamdknlkrhtzzwfj.supabase.co";
    const CHAVE_PUBLICA = "sb_publishable_zCQTgOMfeHlIkuaiZ5CW0g_pCku9j85";
    const db = window.supabase.createClient(URL_SUPABASE, CHAVE_PUBLICA);

    const login = document.getElementById("login");
    const painel = document.getElementById("painel");
    const mensagem = document.getElementById("mensagem");
    const entrar = document.getElementById("entrar");

    function avisar(texto) {
      mensagem.textContent = texto;
    }

    async function verificarAcesso() {
      login.hidden = true;
      painel.hidden = true;

      const { data, error } = await db.auth.getUser();

      if (error || !data.user) {
        login.hidden = false;
        avisar("Faça seu login para continuar.");
        return;
      }

      const { data: vendedores, error: erroVendedor } = await db
        .from("vendedores")
        .select("id,nome,bairro,preco")
        .eq("user_id", data.user.id)
        .limit(1);

      if (erroVendedor) {
        avisar("Não foi possível consultar seu cadastro.");
        return;
      }

      if (!vendedores || vendedores.length === 0) {
        avisar("Esta conta ainda não está vinculada a um vendedor. Procure o administrador.");
        document.getElementById("sair").hidden = false;
        painel.hidden = false;
        return;
      }

      const vendedor = vendedores[0];
      document.getElementById("nomeVendedor").textContent =
        "Vendedor: " + vendedor.nome;
      document.getElementById("bairroVendedor").textContent =
        "Bairro: " + (vendedor.bairro || "Não informado");
      document.getElementById("precoVendedor").textContent =
        "Preço: " + (vendedor.preco == null
          ? "Não informado"
          : Number(vendedor.preco).toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL"
            }));

      painel.hidden = false;
      avisar("Acesso autorizado.");
    }

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      entrar.disabled = true;
      avisar("Entrando...");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("senha").value;

      const { error } = await db.auth.signInWithPassword({
        email, password
      });

      document.getElementById("senha").value = "";
      entrar.disabled = false;

      if (error) {
        avisar("Não foi possível entrar. Confira e-mail e senha.");
        return;
      }

      await verificarAcesso();
    });

    document.getElementById("sair").addEventListener("click", async () => {
      await db.auth.signOut();
      painel.hidden = true;
      login.hidden = false;
      avisar("Você saiu da sua conta.");
    });

    verificarAcesso();
  </script>
</body>
</html>
