<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área do Vendedor - Frango Assado Perto de Mim</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  background: #fff7ed;
  color: #292524;
  margin: 0;
  padding: 16px;
}
main {
  background: white;
  max-width: 620px;
  margin: 24px auto;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 3px 14px #00000012;
}
h1 { color: #b45309; }
h3 { margin-top: 26px; }
label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
}
input, select, textarea {
  width: 100%;
  padding: 11px;
  margin-top: 5px;
  border: 1px solid #aaa;
  border-radius: 7px;
  font: inherit;
}
button {
  padding: 11px 15px;
  margin-top: 12px;
  background: #b45309;
  color: white;
  border: 0;
  border-radius: 7px;
  cursor: pointer;
}
button:disabled { opacity: .5; }
button.secundario { background: #57534e; }
.foto-produto { display:block; width:160px; max-width:100%; height:auto; border-radius:8px; margin:10px 0; }
.ajuda { color:#57534e; font-size:0.9rem; }
.produto {
  border: 1px solid #ddd;
  border-radius: 9px;
  padding: 14px;
  margin-top: 12px;
}
[hidden] { display: none !important; }
#mensagem { padding: 8px 0; }
</style>
</head>
<body>
<main>
<h1>🍗 Área do Vendedor</h1>
<h2>Frango Assado Perto de Mim</h2>
<p id="mensagem" role="status">Verificando acesso...</p>

<section id="login" hidden>
  <form id="formLogin">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password"
           autocomplete="current-password" required>
    <button id="entrar" type="submit">Entrar</button>
  </form>
  <button id="pedirCodigo" type="button" class="secundario">Esqueci minha senha</button>
</section>

<section id="recuperacao" hidden>
  <h3>Criar nova senha</h3>
  <form id="formRecuperacao">
    <label for="codigoRecuperacao">Código recebido por e-mail</label>
    <input id="codigoRecuperacao" inputmode="numeric"
           autocomplete="one-time-code" pattern="[0-9]+" required>
    <label for="novaSenhaVendedor">Nova senha</label>
    <input id="novaSenhaVendedor" type="password"
           autocomplete="new-password" minlength="6" required>
    <label for="confirmarSenhaVendedor">Repita a nova senha</label>
    <input id="confirmarSenhaVendedor" type="password"
           autocomplete="new-password" minlength="6" required>
    <button id="salvarSenhaVendedor" type="submit">Salvar nova senha</button>
  </form>
  <button id="voltarLogin" type="button" class="secundario">Voltar ao login</button>
</section>

<section id="painel" hidden>
  <h3>Meu cadastro</h3>
  <p id="identificacao"></p>

  <form id="formCadastro">
    <label for="whatsapp">WhatsApp principal (com DDD)</label>
    <input id="whatsapp" type="tel" required>

    <label for="whatsapp2">Segundo WhatsApp (opcional)</label>
    <input id="whatsapp2" type="tel">

    <button type="submit">Salvar meu cadastro</button>
  </form>

  <h3>Meus produtos</h3>
  <div id="listaProdutos"></div>

  <h3 id="tituloProduto">Cadastrar produto</h3>
  <form id="formProduto">
    <label for="nomeProduto">Nome do produto</label>
    <input id="nomeProduto" required maxlength="120">

    <label for="categoria">Categoria</label>
    <input id="categoria" value="Frango assado" required>

    <label for="descricao">Descrição (opcional)</label>
    <textarea id="descricao" rows="3"></textarea>

    <label for="precoProduto">Preço (R$)</label>
    <input id="precoProduto" type="number"
           min="0.01" step="0.01" required>

    <label for="disponivel">Disponibilidade</label>
    <select id="disponivel">
      <option value="true">Disponível</option>
      <option value="false">Indisponível</option>
    </select>

    <label for="fotoProduto">Fotografia do produto (opcional)</label>
    <input id="fotoProduto" type="file" accept="image/jpeg,image/png,image/webp">
    <p class="ajuda">JPG, PNG ou WebP, até 2 MB. Ao editar, deixe vazio para manter a fotografia atual.</p>
    <div id="fotoAtual"></div>

    <button type="submit" id="salvarProduto">Salvar produto</button>
    <button type="button" id="cancelarEdicao"
            class="secundario" hidden>Cancelar edição</button>
  </form>

  <button id="sair" type="button" class="secundario">Sair</button>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://mublqamdknlkrhtzzwfj.supabase.co";
const SUPABASE_KEY = "sb_publishable_zCQTgOMfeHlIkuaiZ5CW0g_pCku9j85";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const authRecuperacao = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: false,
    autoRefreshToken: false,
    detectSessionInUrl: false,
    storageKey: "frango-recuperacao-vendedor"
  }
}).auth;

const $ = id => document.getElementById(id);
let vendedor = null;
let produtos = [];
let produtoEmEdicao = null;
const BUCKET_FOTOS = "fotos-produtos";
const TIPOS_FOTO = {
  "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp"
};

function validarFoto(arquivo) {
  if (!arquivo) return null;
  if (!Object.hasOwn(TIPOS_FOTO, arquivo.type)) {
    return "Escolha uma fotografia JPG, PNG ou WebP.";
  }
  if (arquivo.size > 2 * 1024 * 1024) {
    return "A fotografia deve ter no máximo 2 MB.";
  }
  return null;
}

function mostrarFotoAtual(url) {
  const area = $("fotoAtual");
  area.replaceChildren();
  if (!url) return;
  const imagem = document.createElement("img");
  imagem.src = url;
  imagem.alt = "Fotografia atual do produto";
  imagem.className = "foto-produto";
  imagem.loading = "lazy";
  area.append(imagem);
}

async function enviarFoto(produtoId, arquivo) {
  const erroFoto = validarFoto(arquivo);
  if (erroFoto) throw new Error(erroFoto);

  const vendedorId = vendedor.id;
  const { data: produto, error: erroConsulta } = await db.from("produtos")
    .select("foto_url")
    .eq("id", produtoId)
    .eq("vendedor_id", vendedorId)
    .single();
  if (erroConsulta) throw erroConsulta;

  const fotos = db.storage.from(BUCKET_FOTOS);
  const pasta = `${produtoId}/`;
  const caminho = `${pasta}${crypto.randomUUID()}.${TIPOS_FOTO[arquivo.type]}`;
  const { error: erroEnvio } = await fotos.upload(caminho, arquivo, {
    contentType: arquivo.type,
    upsert: false
  });
  if (erroEnvio) throw erroEnvio;

  const url = fotos.getPublicUrl(caminho).data.publicUrl;
  const atualizacao = db.from("produtos")
    .update({ foto_url: url })
    .eq("id", produtoId)
    .eq("vendedor_id", vendedorId);

  // Evita substituir uma foto alterada por outra sessão.
  if (produto.foto_url === null) {
    atualizacao.is("foto_url", null);
  } else {
    atualizacao.eq("foto_url", produto.foto_url);
  }

  const { data: gravacao, error: erroGravacao } = await atualizacao.select("id");
  if (erroGravacao) throw erroGravacao;
  if (!gravacao?.length) {
    await fotos.remove([caminho]);
    throw new Error("O produto mudou durante o envio. Reabra a edição e tente novamente.");
  }

  const prefixo = fotos.getPublicUrl(pasta).data.publicUrl;
  if (produto.foto_url?.startsWith(prefixo)) {
    const nomeAnterior = produto.foto_url.slice(prefixo.length);
    if (/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\.(jpg|png|webp)$/i.test(nomeAnterior)) {
      try {
        const { data: removidas, error } = await fotos.remove([`${pasta}${nomeAnterior}`]);
        if (error || !removidas?.length) {
          console.warn("A foto nova foi salva, mas a anterior não foi removida.", error);
        }
      } catch (erro) {
        console.warn("A foto nova foi salva, mas a anterior não foi removida.", erro);
      }
    }
  }

  return url;
}

function avisar(texto) {
  $("mensagem").textContent = texto;
}
function moeda(valor) {
  return Number(valor).toLocaleString("pt-BR", {
    style: "currency", currency: "BRL"
  });
}
function telefone(valor) {
  let n = String(valor || "").replace(/\D/g, "");
  if (n.startsWith("55") && n.length > 11) n = n.slice(2);
  return n;
}
function limparProduto() {
  produtoEmEdicao = null;
  $("formProduto").reset();
  mostrarFotoAtual(null);
  $("categoria").value = "Frango assado";
  $("tituloProduto").textContent = "Cadastrar produto";
  $("cancelarEdicao").hidden = true;
}
function mostrarLogin(texto) {
  vendedor = null;
  produtos = [];
  $("painel").hidden = true;
  $("login").hidden = false;
  avisar(texto);
}
async function iniciar() {
  $("login").hidden = true;
  $("painel").hidden = true;
  avisar("Verificando acesso...");

  const { data, error } = await db.auth.getUser();
  if (error || !data.user) {
    mostrarLogin("Entre com seu e-mail e senha.");
    return;
  }

  const resposta = await db.from("vendedores")
    .select("id,nome,bairro,whatsapp,whatsapp2")
    .eq("user_id", data.user.id)
    .limit(1);

  if (resposta.error) {
    avisar("Erro ao consultar cadastro: " + resposta.error.message);
    return;
  }
  if (!resposta.data || !resposta.data.length) {
    avisar("Sua conta não está vinculada a um vendedor. Procure o administrador.");
    $("painel").hidden = false;
    $("formCadastro").hidden = true;
    $("formProduto").hidden = true;
    $("listaProdutos").hidden = true;
    $("tituloProduto").hidden = true;
    $("identificacao").textContent = "";
    return;
  }

  vendedor = resposta.data[0];
  $("formCadastro").hidden = false;
  $("formProduto").hidden = false;
  $("listaProdutos").hidden = false;
  $("tituloProduto").hidden = false;
  $("identificacao").textContent =
    vendedor.nome + " — " + (vendedor.bairro || "");
  $("whatsapp").value = vendedor.whatsapp || "";
  $("whatsapp2").value = vendedor.whatsapp2 || "";
  $("painel").hidden = false;
  limparProduto();
  await carregarProdutos();
  avisar("Acesso autorizado.");
}
async function carregarProdutos() {
  const { data, error } = await db.from("produtos")
    .select("id,nome,descricao,categoria,preco,disponivel,foto_url")
    .eq("vendedor_id", vendedor.id)
    .order("id", { ascending: true });

  if (error) {
    avisar("Erro ao carregar produtos: " + error.message);
    return;
  }
  produtos = data || [];
  const lista = $("listaProdutos");
  lista.replaceChildren();

  if (!produtos.length) {
    lista.textContent = "Nenhum produto cadastrado.";
    return;
  }

  for (const p of produtos) {
    const div = document.createElement("div");
    div.className = "produto";
    const titulo = document.createElement("strong");
    titulo.textContent = p.nome;
    const info = document.createElement("p");
    info.textContent = moeda(p.preco) + " — " +
      (p.disponivel ? "Disponível" : "Indisponível");
    const editar = document.createElement("button");
    editar.textContent = "Editar";
    editar.type = "button";
    editar.addEventListener("click", () => editarProduto(p.id));
    const excluir = document.createElement("button");
    excluir.textContent = "Excluir";
    excluir.type = "button";
    excluir.className = "secundario";
    excluir.style.marginLeft = "8px";
    excluir.addEventListener("click", () => excluirProduto(p.id));
    div.append(titulo, info);
    if (p.foto_url) {
      const imagem = document.createElement("img");
      imagem.src = p.foto_url;
      imagem.alt = "Foto de " + p.nome;
      imagem.className = "foto-produto";
      imagem.loading = "lazy";
      div.append(imagem);
    }
    div.append(editar, excluir);
    lista.append(div);
  }
}
function editarProduto(id) {
  const p = produtos.find(item => item.id === id);
  if (!p) return;
  produtoEmEdicao = id;
  $("nomeProduto").value = p.nome || "";
  $("categoria").value = p.categoria || "";
  $("descricao").value = p.descricao || "";
  $("precoProduto").value = p.preco ?? "";
  $("disponivel").value = String(p.disponivel);
  $("fotoProduto").value = "";
  mostrarFotoAtual(p.foto_url);
  $("tituloProduto").textContent = "Editar produto";
  $("cancelarEdicao").hidden = false;
  $("formProduto").scrollIntoView({ behavior: "smooth" });
}
async function excluirProduto(id) {
  if (!vendedor) return;
  if (!confirm("Deseja realmente excluir este produto?")) return;

  const vendedorId = vendedor.id;
  const { data: produto, error: erroConsulta } = await db.from("produtos")
    .select("foto_url")
    .eq("id", id)
    .eq("vendedor_id", vendedorId)
    .single();
  if (erroConsulta) {
    avisar("Não foi possível localizar o produto para exclusão.");
    return;
  }

  const fotos = db.storage.from(BUCKET_FOTOS);
  const pasta = `${id}/`;
  const prefixo = fotos.getPublicUrl(pasta).data.publicUrl;
  const nome = produto.foto_url?.startsWith(prefixo)
    ? produto.foto_url.slice(prefixo.length)
    : "";
  let fotoRemovida = false;
  if (/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\.(jpg|png|webp)$/i.test(nome)) {
    try {
      const { data: removidas, error: erroFoto } = await fotos.remove([`${pasta}${nome}`]);
      if (erroFoto) throw erroFoto;
      fotoRemovida = Boolean(removidas?.length);
    } catch (erro) {
      console.error("Falha ao remover a foto do produto:", erro);
      avisar("Não foi possível remover a foto. O produto ainda está cadastrado.");
      return;
    }
  }

  const exclusao = db.from("produtos")
    .delete()
    .eq("id", id)
    .eq("vendedor_id", vendedorId);
  if (produto.foto_url === null) {
    exclusao.is("foto_url", null);
  } else {
    exclusao.eq("foto_url", produto.foto_url);
  }

  const { data, error } = await exclusao.select("id");
  if (error || !data?.length) {
    if (fotoRemovida) {
      // Limpa o endereço removido, preservando uma foto salva em outra sessão.
      const { error: erroLimpeza } = await db.from("produtos")
        .update({ foto_url: null })
        .eq("id", id)
        .eq("vendedor_id", vendedorId)
        .eq("foto_url", produto.foto_url);
      if (erroLimpeza) console.warn("Falha ao limpar o endereço da foto.", erroLimpeza);
    }
    limparProduto();
    await carregarProdutos();
    avisar(fotoRemovida
      ? "A foto foi removida, mas a exclusão do produto não foi confirmada."
      : "Não foi possível excluir o produto. Atualize a lista e tente novamente.");
    return;
  }
  limparProduto();
  await carregarProdutos();
  avisar("Produto excluído.");
}
let emailRecuperacao = "";
let codigoVerificado = false;

$("pedirCodigo").addEventListener("click", async () => {
  const email = $("email");
  if (!email.reportValidity()) return;

  $("pedirCodigo").disabled = true;
  $("entrar").disabled = true;
  try {
    emailRecuperacao = email.value.trim();
    const redirectTo = new URL("vendedor.html", window.location.href).href;
    const { error } = await authRecuperacao.resetPasswordForEmail(
      emailRecuperacao, { redirectTo }
    );
    if (error) throw error;

    $("senha").value = "";
    $("login").hidden = true;
    $("recuperacao").hidden = false;
    $("codigoRecuperacao").focus();
    avisar("Se o e-mail estiver cadastrado, você receberá um código.");
  } catch {
    avisar("Não foi possível solicitar o código. Aguarde um pouco e tente novamente.");
  } finally {
    $("pedirCodigo").disabled = false;
    $("entrar").disabled = false;
  }
});

async function fecharRecuperacao(mensagem) {
  if (codigoVerificado) await authRecuperacao.signOut({ scope: "local" });
  codigoVerificado = false;
  emailRecuperacao = "";
  $("formRecuperacao").reset();
  $("codigoRecuperacao").disabled = false;
  $("recuperacao").hidden = true;
  mostrarLogin(mensagem);
}

$("voltarLogin").addEventListener("click", async () => {
  await fecharRecuperacao("Entre com seu e-mail e senha.");
});

$("formRecuperacao").addEventListener("submit", async evento => {
  evento.preventDefault();
  const senha = $("novaSenhaVendedor").value;
  if (senha !== $("confirmarSenhaVendedor").value) {
    avisar("As duas senhas precisam ser iguais.");
    return;
  }

  $("salvarSenhaVendedor").disabled = true;
  $("voltarLogin").disabled = true;
  try {
    if (!codigoVerificado) {
      const { error } = await authRecuperacao.verifyOtp({
        email: emailRecuperacao,
        token: $("codigoRecuperacao").value.trim(),
        type: "recovery"
      });
      if (error) {
        avisar("Não foi possível validar o código. Confira o e-mail mais recente.");
        return;
      }
      codigoVerificado = true;
      $("codigoRecuperacao").value = "";
      $("codigoRecuperacao").disabled = true;
    }

    const { error } = await authRecuperacao.updateUser({ password: senha });
    if (error) {
      avisar("Não foi possível salvar a senha: " + error.message);
      return;
    }
    await fecharRecuperacao("Senha atualizada. Entre com a nova senha.");
  } catch {
    avisar("Não foi possível concluir a recuperação. Tente novamente.");
  } finally {
    $("salvarSenhaVendedor").disabled = false;
    $("voltarLogin").disabled = false;
  }
});

$("formLogin").addEventListener("submit", async e => {
  e.preventDefault();
  $("entrar").disabled = true;
  avisar("Entrando...");
  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("senha").value
  });
  $("senha").value = "";
  $("entrar").disabled = false;
  if (error) {
    avisar("Não foi possível entrar. Confira e-mail e senha.");
    return;
  }
  await iniciar();
});
$("formCadastro").addEventListener("submit", async e => {
  e.preventDefault();
  if (!vendedor) return;

  const w1 = telefone($("whatsapp").value);
  const w2 = telefone($("whatsapp2").value);
  if (![10, 11].includes(w1.length) ||
      (w2 && ![10, 11].includes(w2.length)) ||
      (w2 && w1 === w2)) {
    avisar("Confira os números de WhatsApp com DDD.");
    return;
  }

  const botao = e.submitter;
  botao.disabled = true;
  const { data, error } = await db.from("vendedores")
    .update({
      whatsapp: w1,
      whatsapp2: w2 || null
    })
    .eq("id", vendedor.id)
    .select("id");

  botao.disabled = false;
  if (error || !data || !data.length) {
    avisar("Não foi possível salvar o cadastro.");
    return;
  }
  avisar("Cadastro atualizado com sucesso.");
});
$("formProduto").addEventListener("submit", async e => {
  e.preventDefault();
  if (!vendedor) return;
  const botao = $("salvarProduto");
  const arquivo = $("fotoProduto").files[0];
  const erroFoto = validarFoto(arquivo);
  if (erroFoto) {
    avisar(erroFoto);
    return;
  }
  botao.disabled = true;
  avisar("Salvando produto...");

  const dados = {
    nome: $("nomeProduto").value.trim(),
    categoria: $("categoria").value.trim(),
    descricao: $("descricao").value.trim(),
    preco: Number($("precoProduto").value),
    disponivel: $("disponivel").value === "true"
  };

  let consulta;
  if (produtoEmEdicao !== null) {
    consulta = db.from("produtos")
      .update(dados)
      .eq("id", produtoEmEdicao)
      .eq("vendedor_id", vendedor.id)
      .select("id");
  } else {
    consulta = db.from("produtos")
      .insert({ ...dados, vendedor_id: vendedor.id })
      .select("id");
  }

  const { data, error } = await consulta;
  if (error || !data || !data.length) {
    botao.disabled = false;
    avisar("Não foi possível salvar o produto. Verifique as permissões.");
    return;
  }

  let mensagem = "Produto salvo com sucesso.";
  if (arquivo) {
    try {
      avisar("Produto salvo. Enviando fotografia...");
      await enviarFoto(data[0].id, arquivo);
      mensagem = "Produto e fotografia salvos com sucesso.";
    } catch (erro) {
      console.error("Falha ao enviar fotografia:", erro);
      mensagem = "Produto salvo, mas a fotografia não foi enviada: " + erro.message;
    }
  }
  botao.disabled = false;
  limparProduto();
  await carregarProdutos();
  avisar(mensagem);
});
$("cancelarEdicao").addEventListener("click", limparProduto);
$("sair").addEventListener("click", async () => {
  const { error } = await db.auth.signOut();
  if (error) {
    avisar("Não foi possível sair. Tente novamente.");
    return;
  }
  mostrarLogin("Você saiu da sua conta.");
});
iniciar();
</script>
</body>
</html>
