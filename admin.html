<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração - Frango Assado Perto de Mim</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff7ed;
      padding: 20px;
      color: #292524;
    }
    main {
      background: white;
      max-width: 480px;
      margin: 35px auto;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 14px #00000012;
    }
    h1 { color: #b45309; }
    input, button {
      box-sizing: border-box;
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      font-size: 16px;
      border-radius: 7px;
    }
    input { border: 1px solid #a8a29e; }
    button {
      background: #b45309;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #mensagem, #mensagemCadastro {
      overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }
    hr {
      border: 0;
      border-top: 1px solid #e7e5e4;
      margin: 25px 0;
    }
    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>🍗 Área Administrativa</h1>
    <h2>Frango Assado Perto de Mim</h2>
    <p>Acesso exclusivo do administrador.</p>

    <section id="login" hidden>
      <form id="formLogin">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
      </form>
      <button id="recuperar" type="button">Esqueci minha senha</button>
    </section>

    <section id="novaSenha" hidden>
      <h2>Criar nova senha</h2>
      <form id="formSenha">
        <label for="senhaNova">Nova senha</label>
        <input id="senhaNova" type="password"
          autocomplete="new-password" minlength="12" required>
        <button type="submit">Salvar nova senha</button>
      </form>
    </section>

    <section id="painel" hidden>
      <h2>Acesso autorizado</h2>
      <p>Login administrativo realizado com sucesso.</p>

      <hr>

      <h2>Cadastrar vendedor</h2>
      <form id="formVendedor">
        <label for="nomeVendedor">Nome do vendedor</label>
        <input id="nomeVendedor" type="text" maxlength="150" required>

        <label for="bairroVendedor">Bairro</label>
        <input id="bairroVendedor" type="text" maxlength="150" required>

        <label for="precoVendedor">Preço (R$)</label>
        <input id="precoVendedor" type="number"
          min="0.01" step="0.01" required>

        <label for="enderecoVendedor">Endereço</label>
        <input id="enderecoVendedor" type="text" maxlength="300" required>

        <label for="whatsappVendedor">WhatsApp 1 (obrigatório)</label>
        <input id="whatsappVendedor" type="tel"
          placeholder="12999999999" required>

        <label for="whatsapp2Vendedor">WhatsApp 2 (opcional)</label>
        <input id="whatsapp2Vendedor" type="tel"
          placeholder="Se tiver outro número">

        <button id="salvarVendedor" type="submit">
          Salvar vendedor
        </button>
      </form>

      <p id="mensagemCadastro" role="status" aria-live="polite"></p>

      <hr>

      <button id="sair" type="button">Sair</button>
    </section>

    <p id="mensagem" role="status" aria-live="polite">
      Verificando acesso...
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const URL_SUPABASE = "https://mublqamdknlkrhtzzwfj.supabase.co";
    const CHAVE_PUBLICA = "sb_publishable_zCQTgOMfeHlIkuaiZ5CW0g_pCku9j85";

    const login = document.getElementById("login");
    const painel = document.getElementById("painel");
    const novaSenha = document.getElementById("novaSenha");
    const mensagem = document.getElementById("mensagem");
    const mensagemCadastro = document.getElementById("mensagemCadastro");
    const botaoSalvar = document.getElementById("salvarVendedor");

    let administradorAutorizado = false;

    function avisar(texto) {
      mensagem.textContent = texto;
    }

    function mostrar(secao) {
      login.hidden = secao !== "login";
      painel.hidden = secao !== "painel";
      novaSenha.hidden = secao !== "novaSenha";

      if (secao !== "painel") {
        administradorAutorizado = false;
      }
    }

    function normalizarTelefone(valor) {
      let numero = valor.replace(/\D/g, "");

      if (numero.startsWith("55") && numero.length > 11) {
        numero = numero.substring(2);
      }

      if (!/^\d{10,11}$/.test(numero)) {
        return null;
      }

      return numero;
    }

    if (!window.supabase) {
      mostrar("login");
      avisar("Não foi possível carregar a conexão. Atualize a página.");
    } else {
      const db = window.supabase.createClient(
        URL_SUPABASE, CHAVE_PUBLICA
      );

      const parametros = new URLSearchParams(window.location.search);
      const fragmento = new URLSearchParams(window.location.hash.substring(1));
      const retornoRecuperacao =
        parametros.get("type") === "recovery" ||
        fragmento.get("type") === "recovery" ||
        parametros.has("token_hash");

      let recuperacaoAtiva = retornoRecuperacao;
      let verificacao = 0;

      async function verificarAdmin() {
        const minhaVerificacao = ++verificacao;
        const { data, error } = await db.auth.getUser();

        if (minhaVerificacao !== verificacao || recuperacaoAtiva) return;

        if (error || !data.user) {
          mostrar("login");
          return;
        }

        if (data.user.app_metadata?.role !== "admin") {
          await db.auth.signOut();

          if (recuperacaoAtiva) return;

          mostrar("login");
          avisar("Esta conta não possui autorização administrativa.");
          return;
        }

        administradorAutorizado = true;
        mostrar("painel");
        avisar("Administrador autenticado.");
      }

      db.auth.onAuthStateChange((evento) => {
        if (evento === "PASSWORD_RECOVERY") {
          recuperacaoAtiva = true;
          ++verificacao;
          mostrar("novaSenha");
          avisar("Escolha uma nova senha com pelo menos 12 caracteres.");
        } else if (evento === "SIGNED_OUT") {
          ++verificacao;
          mostrar("login");
        }
      });

      document.getElementById("formLogin")
        .addEventListener("submit", async (evento) => {
          evento.preventDefault();
          avisar("Verificando acesso...");

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("senha").value;

          const { error } = await db.auth.signInWithPassword({
            email, password
          });

          document.getElementById("senha").value = "";

          if (error) {
            avisar("Não foi possível entrar. Confira e-mail e senha.");
            return;
          }

          await verificarAdmin();
        });

      document.getElementById("recuperar")
        .addEventListener("click", async () => {
          const email = document.getElementById("email").value.trim();

          if (!email) {
            avisar("Digite seu e-mail antes de recuperar a senha.");
            return;
          }

          avisar("Solicitando recuperação...");

          const redirectTo = new URL(
            "admin.html", window.location.href
          ).href;

          const { error } = await db.auth.resetPasswordForEmail(
            email, { redirectTo }
          );

          avisar(error
            ? "Não foi possível solicitar a recuperação."
            : "Se o e-mail estiver cadastrado, você receberá instruções.");
        });

      document.getElementById("formSenha")
        .addEventListener("submit", async (evento) => {
          evento.preventDefault();

          if (!recuperacaoAtiva) {
            avisar("Solicite um novo link de recuperação de senha.");
            return;
          }

          const password = document.getElementById("senhaNova").value;
          avisar("Salvando nova senha...");

          const { error } = await db.auth.updateUser({ password });
          document.getElementById("senhaNova").value = "";

          if (error) {
            avisar("Não foi possível salvar a nova senha. Solicite outro link se necessário.");
            return;
          }

          recuperacaoAtiva = false;
          ++verificacao;
          history.replaceState(null, "", window.location.pathname);
          avisar("Senha atualizada. Verificando autorização...");
          await verificarAdmin();
        });

      document.getElementById("formVendedor")
        .addEventListener("submit", async (evento) => {
          evento.preventDefault();

          if (!administradorAutorizado) {
            mensagemCadastro.textContent =
              "Acesso administrativo não autorizado.";
            return;
          }

          const nome = document.getElementById("nomeVendedor").value.trim();
          const bairro = document.getElementById("bairroVendedor").value.trim();
          const endereco = document.getElementById("enderecoVendedor").value.trim();
          const preco = Number(
            document.getElementById("precoVendedor").value
          );

          const whatsapp = normalizarTelefone(
            document.getElementById("whatsappVendedor").value
          );

          const segundoValor = document.getElementById(
            "whatsapp2Vendedor"
          ).value.trim();

          const whatsapp2 = segundoValor
            ? normalizarTelefone(segundoValor)
            : null;

          if (!nome || !bairro || !endereco ||
              !Number.isFinite(preco) || preco <= 0) {
            mensagemCadastro.textContent =
              "Preencha corretamente os dados do vendedor.";
            return;
          }

          if (!whatsapp || (segundoValor && !whatsapp2)) {
            mensagemCadastro.textContent =
              "Informe um WhatsApp válido com DDD.";
            return;
          }

          if (whatsapp2 && whatsapp2 === whatsapp) {
            mensagemCadastro.textContent =
              "O segundo WhatsApp deve ser diferente do primeiro.";
            return;
          }

          botaoSalvar.disabled = true;
          mensagemCadastro.textContent = "Salvando vendedor...";

          try {
            const { data: usuario, error: erroUsuario } =
              await db.auth.getUser();

            if (erroUsuario || !usuario.user ||
                usuario.user.app_metadata?.role !== "admin") {
              administradorAutorizado = false;
              mostrar("login");
              mensagemCadastro.textContent =
                "Sua autorização precisa ser verificada novamente.";
              return;
            }

            const { error } = await db.from("vendedores").insert({
              nome,
              bairro,
              preco,
              endereco,
              whatsapp,
              whatsapp2
            });

            if (error) {
              console.error("Erro ao cadastrar vendedor:", error);
              mensagemCadastro.textContent =
                "Não foi possível salvar. Confira as permissões e os dados no Supabase.";
              return;
            }

            document.getElementById("formVendedor").reset();
            mensagemCadastro.textContent =
              "Vendedor cadastrado com sucesso!";
          } catch (erro) {
            console.error("Falha de conexão:", erro);
            mensagemCadastro.textContent =
              "Falha de conexão. Verifique a internet e tente novamente.";
          } finally {
            botaoSalvar.disabled = false;
          }
        });

      document.getElementById("sair")
        .addEventListener("click", async () => {
          recuperacaoAtiva = false;
          ++verificacao;
          administradorAutorizado = false;
          await db.auth.signOut();
          mostrar("login");
          avisar("Você saiu da Área Administrativa.");
        });

      async function iniciar() {
        if (retornoRecuperacao) {
          mostrar("novaSenha");
          avisar("Validando link de recuperação...");
        }

        const { data, error } = await db.auth.getSession();

        if (recuperacaoAtiva) {
          if (error || !data.session) {
            mostrar("login");
            recuperacaoAtiva = false;
            avisar("O link de recuperação não foi validado. Solicite um novo link.");
          } else {
            mostrar("novaSenha");
            avisar("Escolha uma nova senha com pelo menos 12 caracteres.");
          }
          return;
        }

        await verificarAdmin();
      }

      iniciar();
    }
  </script>
</body>
</html>
